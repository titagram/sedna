scenarios:
  - scenario_id: private-ip-information-gathering
    target: 192.168.0.1
    terms: [private, lan, information gathering, http, service]
    facts:
      - {namespace: network, key: exposure, value: private, confidence: 1.0}
      - {namespace: typed, key: os_family, value: linux, confidence: 1.0}
    expected_lanes:
      reference: [ref-private-enumeration]
      case_step: [case-http-success-step]
      negative_evidence: [case-http-failed-step]
      guidance: [rule-private-enumeration]
    relevant_artifact_ids:
      - ref-private-enumeration
      - ref-independent-enumeration
      - ref-copied-enumeration-a
      - ref-copied-enumeration-b
      - case-http-success-step
      - case-http-failed-step
      - rule-private-enumeration
    incompatible_artifact_ids: [ref-windows-management]
  - scenario_id: unknown-os-conditional-windows
    target: 10.123.123.123
    terms: [windows, management, information gathering]
    facts: []
    expected_lanes:
      reference: [ref-windows-management]
    expected_missing_context_contains: [typed.os_family]
    relevant_artifact_ids:
      - ref-windows-management
      - ref-independent-enumeration
      - ref-copied-enumeration-a
      - ref-copied-enumeration-b
    incompatible_artifact_ids: []
  - scenario_id: confirmed-linux-excludes-windows
    target: 10.123.123.123
    terms: [windows, management, information gathering]
    facts:
      - {namespace: typed, key: os_family, value: linux, confidence: 1.0}
    expected_absent_artifact_ids: [ref-windows-management]
    expected_rejected_artifact_ids: [ref-windows-management]
    expected_lanes:
      reference: [ref-independent-enumeration]
    relevant_artifact_ids:
      - ref-independent-enumeration
      - ref-copied-enumeration-a
      - ref-copied-enumeration-b
    incompatible_artifact_ids: [ref-windows-management]
  - scenario_id: copied-source-diversity
    target: 10.10.10.10
    terms: [baseline, enumeration, service discovery, information gain]
    facts: []
    lane_limit: 2
    expected_lanes:
      reference: [ref-independent-enumeration]
    expected_copy_group_maximum: 1
    relevant_artifact_ids:
      - ref-independent-enumeration
      - ref-copied-enumeration-a
      - ref-copied-enumeration-b
      - case-http-success-step
      - rule-private-enumeration
